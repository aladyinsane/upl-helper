# Provider type -> the CCN sequence ranges (positions 3-6) expected for it.
facility_type_ranges:
  inpatient_hospital:
    - [1, 879]      # short-term general and specialty
    - [1300, 1399]  # critical access
    - [2000, 2299]  # long-term care hospital
    - [3025, 3099]  # rehabilitation
    - [3300, 3399]  # children's
    - [4000, 4499]  # psychiatric
  nursing_facility:
    - [5000, 6499]  # skilled nursing
