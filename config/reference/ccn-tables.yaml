# CCN reference tables - NOT VERIFIED
#
# These were written from memory, without access to any CMS source, in an
# environment that cannot reach cms.gov. They are very likely to contain
# errors.
#
# While `verified: false`, the checks that depend on these tables (IDN002,
# IDN003) DO NOT RUN. They report SKIPPED with this reason. A check that
# invents findings from a table nobody has checked is worse than no check.
#
# To verify:
#   - SSA state codes: CMS State Operations Manual, or the Provider of
#     Services file, whose CCN prefixes can be cross-tabulated against its
#     own state field. Note these are SSA codes, NOT FIPS codes.
#   - Facility type ranges: State Operations Manual Chapter 2, or derive them
#     from the POS file by cross-tabulating CCN positions 3-6 against
#     provider category.
# Then set verified: true.

verified: false

